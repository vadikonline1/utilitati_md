name: Build and release (EAS)

on:
  push:
    branches:
      - deploy
    tags:
      - "v*.*.*"

jobs:
  build_android:
    name: Android preview APK
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    type: build
    params:
      platform: android
      profile: preview

  build_ios:
    name: iOS preview
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    type: build
    params:
      platform: ios
      profile: preview

  build_android_prod:
    name: Android production (AAB)
    if: startsWith(github.ref, 'refs/tags/v')
    type: build
    params:
      platform: android
      profile: production

  build_ios_prod:
    name: iOS production
    if: startsWith(github.ref, 'refs/tags/v')
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit to Google Play
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_android_prod]
    type: submit
    params:
      build_id: ${{ needs.build_android_prod.outputs.build_id }}
      platform: android
      profile: production