{% extends "base.html" %}
{% block title %}{{ t('profile_title') }} · UTILITĂȚI.MD{% endblock %}
{% block body %}
<main class="dashboard">
  <h1>{{ t('profile_title') }}</h1>
  {% if message %}<p class="notice">{{ message }}</p>{% endif %}
  <div class="card">
    <h2>{{ t('profile_change_password') }}</h2>
    <form method="post" action="/profile" class="form-stack">
      <label>{{ t('profile_old_password') }}
        <input type="password" name="old_password" autocomplete="current-password" required>
      </label>
      <label>{{ t('profile_new_password') }}
        <input type="password" name="new_password" autocomplete="new-password" required>
      </label>
      <label>{{ t('profile_confirm_new') }}
        <input type="password" name="confirm" autocomplete="new-password" required>
      </label>
      <button type="submit">{{ t('profile_save') }}</button>
    </form>
  </div>
</main>
{% endblock %}
