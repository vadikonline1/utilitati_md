services:
  web:
    # Imaginea este construita SI publicata de GitHub Actions
    # (.github/workflows/build-docker.yml) pe ghcr.io — aici NU mai compilam
    # nimic local. IMAGE_TAG selecteaza build-ul dorit: "deploy" / "main" /
    # "<sha8>"; implicit folosim build-ul ramurii deploy (ultimul publicat).
    image: ghcr.io/vadikonline1/utilitati_md:${IMAGE_TAG:-deploy}
    container_name: utilitati-md
    # Trage mereu cea mai noua imagine publicata la `docker compose up`.
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        #required: false
    volumes:
      - utilitati-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  utilitati-data: