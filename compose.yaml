services:
  web:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: utilitati-md:latest
    container_name: utilitati-md
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        #required: false
    volumes:
      - utilitati-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  utilitati-data: