services:
  web:
    build: .
    image: utilitati-md:latest
    container_name: utilitati-md
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Change these in production.
      UTILITATI_SECRET_KEY: "${UTILITATI_SECRET_KEY:-change-me-in-production}"
      UTILITATI_USERNAME: "${UTILITATI_USERNAME:-admin}"
      UTILITATI_PASSWORD: "${UTILITATI_PASSWORD:-admin}"
      # SQLite database lives on the volume so data survives rebuilds.
      UTILITATI_DB: /app/data/utilitati.db
    volumes:
      - utilitati-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  utilitati-data:
