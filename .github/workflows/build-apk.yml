name: Build Android APK

# Rulează la fiecare push pe `deploy` și manual (Actions -> Run workflow).
on:
  push:
    branches: [deploy]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle heap + local.properties
        run: |
          # local.properties pointing to the runner SDK
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # Bump Gradle memory to avoid OOM on small runners
          if [ -f android/gradle.properties ]; then
            echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m" >> android/gradle.properties
            echo "org.gradle.daemon=false" >> android/gradle.properties
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: utilitati-mobile-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: apk-${{ github.sha }}
          name: APK ${{ github.ref_name }} (${{ github.sha }})
          body: |
            Build automat APK Android (debug-signed, instalabil direct).

            **Versiune aplicație:** 1.0.0
            **API URL:** https://utilitati.nistorlazar.md/api
          files: mobile/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: mobile

      - name: Generate native ios project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install
        working-directory: mobile

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document || true
          cd ios
          if [ -f Podfile ]; then pod install; fi
          cd ..
        working-directory: mobile

      - name: Build iOS app (simulator, unsigned)
        run: |
          cd ios
          WS=$(ls -1 *.xcworkspace 2>/dev/null | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WS" 2>/dev/null | awk '/Schemes:/{f=1;next} /^$/{f=0} f{print; exit}')
          echo "workspace=$WS scheme=$SCHEME"
          xcodebuild -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          cd ..
        working-directory: mobile

      - name: Upload iOS app (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: utilitati-mobile-ios-simulator
          path: mobile/ios/build/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: warn

      - name: Publish iOS info to GitHub Release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: ios-${{ github.sha }}
          name: iOS ${{ github.ref_name }} (${{ github.sha }})
          body: |
            Build iOS pentru Simulator, **nesemnat** (fără certificat de pe acest runner).

            Un `.app` pentru Simulator este disponibil ca artifact. Pentru instalare
            pe dispozitiv fizic (iPhone) e nevoie de un Certificate/PROVISIONING
            (Apple Developer) — vezi job-ul de Release.
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}