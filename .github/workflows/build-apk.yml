name: Build Android APK

# Rulează la fiecare push pe `main` (stable) și manual.
# NU mai publică GitHub Releases (doar artifacts pentru debug) — release-urile
# combinate (APK + iOS + Docker) se fac din workflow-ul `release-all.yml`
# (manual, Actions -> Release all-in-one), cu tag `release-<sha>`.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'assets/**'
      - 'google-services.json'
      - 'GoogleService-Info.plist'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  check-push-credentials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify Expo push credentials
        run: node scripts/ensure-expo-push-credentials.mjs --android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}

  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    needs: check-push-credentials

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Get app version
        id: version
        run: echo "app_version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Embed build SHA (in-app update feed)
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.extra.build_sha='${{ github.sha }}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          echo "embedded build_sha=${{ github.sha }}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle heap + local.properties
        run: |
          # local.properties pointing to the runner SDK
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # Bump Gradle memory to avoid OOM on small runners
          if [ -f android/gradle.properties ]; then
            echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m" >> android/gradle.properties
            echo "org.gradle.daemon=false" >> android/gradle.properties
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v6
        with:
          name: utilitati-mobile-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate native ios project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document || true
          cd ios
          if [ -f Podfile ]; then pod install; fi
          cd ..

      - name: Build iOS app (simulator, unsigned)
        run: |
          cd ios
          # Use a real .xcworkspace directory (ignore stray files like contents.xcworkspacedata)
          WS=$(find . -maxdepth 1 -type d -name '*.xcworkspace' | head -1)
          if [ -z "$WS" ]; then
            # fall back to any .xcworkspace file path (directory or not)
            WS=$(ls -1d *.xcworkspace 2>/dev/null | head -1)
          fi
          echo "workspace=${WS:-<none>}"
          if [ -z "$WS" ]; then echo "::error::No .xcworkspace found under ios/"; exit 1; fi

          # The real app scheme is generated by expo prebuild and matches the
          # sanitized expo.name (e.g. "Utilitati.MD" -> "UtilitatiMD"). Pods like
          # "EXApplication" are separate schemes and never produce a .app.
          PRODUCT_NAME=$(node -p "require('../app.json').expo.name.replace(/[^A-Za-z0-9]/g,'')" 2>/dev/null || echo "")
          SCHEMES=$(xcodebuild -list -workspace "$WS" 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2 | grep -o '[A-Za-z0-9_.-]*')
          SCHEME=""
          if [ -n "$PRODUCT_NAME" ] && printf '%s\n' "$SCHEMES" | grep -qx "$PRODUCT_NAME"; then
            SCHEME="$PRODUCT_NAME"
            echo "scheme=$SCHEME (app name match)"
          fi
          # Fall back: first non-Pod scheme whose product is an *.app bundle.
          if [ -z "$SCHEME" ]; then
            for c in $SCHEMES; do
              case "$c" in Pods-*) continue;; esac
              WRAPPER=$(xcodebuild -workspace "$WS" -scheme "$c" -showBuildSettings 2>/dev/null | sed -n 's/.*WRAPPER_NAME = //p' | head -1)
              case "$WRAPPER" in
                *.app) SCHEME="$c"; echo "scheme=$SCHEME (produces $WRAPPER)"; break;;
              esac
            done
          fi
          if [ -z "$SCHEME" ]; then
            echo "::error::Could not detect the app Xcode scheme under ios/ (candidates: $SCHEMES)"
            exit 1
          fi
          xcodebuild -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          cd ..

      - name: Verify iOS app bundle
        run: |
          ls -d ios/build/Build/Products/Release-iphonesimulator/*.app \
            || { echo "::error::No .app produced by the iOS build"; exit 1; }

      - name: Upload iOS app (workflow artifact)
        uses: actions/upload-artifact@v6
        with:
          name: utilitati-mobile-ios-simulator
          path: ios/build/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error