name: Release all-in-one (APK + iOS + Docker)

# Release COMBINAT, creat manual (Actions -> Release all-in-one -> Run workflow).
# Produce intr-un singur GitHub Release: APK Android, aplicatia iOS (simulator)
# si imaginea Docker backend — tag `release-<sha>` (compatibil cu feed-ul de
# update in-app, vezi src/utils/update.ts).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numele versiunii (ex: 1.0)'
        required: true
        default: '1.0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-push-credentials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify Expo push credentials
        run: node scripts/ensure-expo-push-credentials.mjs --android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}

  build-apk:
    runs-on: ubuntu-latest
    needs: check-push-credentials

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Embed build SHA (in-app update feed)
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.extra.build_sha='${{ github.sha }}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          echo "embedded build_sha=${{ github.sha }}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle heap + local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          if [ -f android/gradle.properties ]; then
            echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m" >> android/gradle.properties
            echo "org.gradle.daemon=false" >> android/gradle.properties
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v5
        with:
          name: utilitati-mobile-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate native ios project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document || true
          cd ios
          if [ -f Podfile ]; then pod install; fi
          cd ..

      - name: Build iOS app (simulator, unsigned)
        run: |
          cd ios
          WS=$(find . -maxdepth 1 -type d -name '*.xcworkspace' | head -1)
          if [ -z "$WS" ]; then
            WS=$(ls -1d *.xcworkspace 2>/dev/null | head -1)
          fi
          echo "workspace=${WS:-<none>}"
          SCHEME=$(xcodebuild -list -workspace "$WS" 2>/dev/null \
            | sed -n '/Schemes:/,$p' | tail -n +2 \
            | grep -v '^\s*$' | grep -iv 'pod' | head -1 | xargs)
          echo "scheme=${SCHEME:-<none>}"
          if [ -z "$SCHEME" ]; then echo "::error::Could not detect an Xcode scheme under ios/"; exit 1; fi
          xcodebuild -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          cd ..

      - name: Upload iOS app (workflow artifact)
        uses: actions/upload-artifact@v5
        with:
          name: utilitati-mobile-ios-simulator
          path: ios/build/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: warn

  build-docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [build-apk, build-ios, build-docker]

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get app version
        id: version
        run: echo "app_version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: utilitati-mobile-apk
          path: dist-release

      - name: Download iOS artifact
        uses: actions/download-artifact@v5
        with:
          name: utilitati-mobile-ios-simulator
          path: dist-release-ios

      - name: Prepare release files
        run: |
          cd dist-release
          APK=$(ls *.apk | head -1)
          cp "$APK" "utilitati-md-${{ github.sha }}.apk"
          cd ..
          cd dist-release-ios
          APP=$(ls -d *.app | head -1)
          zip -qr "../utilitati-md-ios-simulator-${{ github.sha }}.zip" "$APP"
          cd ..

      - name: Publish combined GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ inputs.version }} (${{ github.sha }})
          body: |
            Release combinat: **APK Android + iOS (simulator) + imagine Docker**.

            **Versiune aplicație:** ${{ steps.version.outputs.app_version }}
            **Commit:** ${{ github.sha }}
            **API URL:** https://utilitati.nistorlazar.md/api

            - `utilitati-md-<sha>.apk` — Android, instalabil direct (debug-signed).
            - `utilitati-md-ios-simulator-<sha>.zip` — aplicația iOS pentru **Simulator, nesemnată** (pe dispozitiv fizic e nevoie de certificat Apple).
            - Imagine Docker backend: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}` (server: `docker compose pull + up`).
          files: |
            dist-release/utilitati-md-${{ github.sha }}.apk
            utilitati-md-ios-simulator-${{ github.sha }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
