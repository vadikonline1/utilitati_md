name: Build Docker image

# Construiește imaginea backend din Dockerfile și o publică pe GitHub Container
# Registry (ghcr.io) la fiecare push pe `main` / `deploy` și manual. Serverul
# poate trage imaginea publicată (docker compose pull + up) în loc să
# re-construiască local.
on:
  push:
    branches: [main, deploy]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          BRANCH_TAG="${{ github.ref_name }}"
          SHA_TAG="${GITHUB_SHA:0:8}"
          # latest: main și deploy sunt ambele candidate; main are prioritate.
          LATEST="$BASE:latest"
          echo "tags=$BASE:$BRANCH_TAG,$BASE:$SHA_TAG,$LATEST" | tee -a "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max